name: CS2 Inventory Tracker

on:
  schedule:
    # Her saat (UTC :07) dener; tracker son başarılı rapordan 7,5 saat geçmediyse hemen çıkar.
    # Böylece rapor ~8 saatte bir gelir ve başarısız bir deneme bir saat sonra tekrarlanır.
    - cron: '7 * * * *'
  # Ev bilgisayarı doğrudan Steam fiyatlarını gönderince rapor taze fiyatlarla hemen hazırlanır (7,5 saat kuralı geçerli).
  push:
    branches: [main]
    paths: ['data/steam_prices.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cs2-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    # Takılan bir istek runner'ı uzun süre meşgul etmesin.
    timeout-minutes: 15
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check calculations and failure handling
        run: python -m unittest -v

      - name: Fetch inventory, update JSON and send Telegram report
        id: tracker
        timeout-minutes: 8
        env:
          STEAM_ID: ${{ secrets.STEAM_ID }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          MIN_HOURS_BETWEEN_REPORTS: ${{ github.event_name == 'workflow_dispatch' && '0' || '7.5' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      # Telegram başarısız olsa bile alınmış gerçek fiyatları kaydet.
      # Önceki adım başarısızsa iş akışı kırmızı kalır; hata gizlenmez.
      - name: Commit changed JSON files
        if: ${{ !cancelled() && steps.tracker.outcome != 'skipped' }}
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ site/data/latest.json
          if git diff --cached --quiet; then
            echo "No JSON changes."
            exit 0
          fi
          git commit -m "chore: update Steam market data"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
