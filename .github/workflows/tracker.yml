name: CS2 Inventory Tracker

on:
  schedule:
    # UTC → Türkiye (UTC+3): 00:07, 08:07, 16:07.
    # Saat başındaki yoğunluğu azaltır; GitHub kesin çalıştırma saati garanti etmez.
    - cron: '7 21,5,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cs2-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    # Takılan bir istek runner'ı uzun süre meşgul etmesin.
    timeout-minutes: 15
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check calculations and failure handling
        run: python -m unittest -v

      - name: Fetch inventory, update JSON and send Telegram report
        id: tracker
        timeout-minutes: 8
        env:
          STEAM_ID: ${{ secrets.STEAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      # Telegram başarısız olsa bile alınmış gerçek fiyatları kaydet.
      # Önceki adım başarısızsa iş akışı kırmızı kalır; hata gizlenmez.
      - name: Commit changed JSON files
        if: ${{ !cancelled() && steps.tracker.outcome != 'skipped' }}
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/history.json site/data/latest.json
          if git diff --cached --quiet; then
            echo "No JSON changes."
            exit 0
          fi
          git commit -m "chore: update Steam market data"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
